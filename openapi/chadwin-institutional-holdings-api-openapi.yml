openapi: 3.2.0
info:
  title: Chadwin Institutional holdings API
  version: v1
  description: Explore the available endpoints, view their parameters and response fields, and see example requests and responses. For help understanding the datasets and planning your integration, read the guides.
servers:
- url: https://api.chadwin.co
tags:
- name: Institutional holdings
  description: Find institutional managers and reporting periods, retrieve Form 13F filings and holdings, and view a manager's holdings and consolidated positions. Follow new Forms 13F-HR and 13F-NT and their amendments through the update feed.
  externalDocs:
    description: Read the institutional holdings guide
    url: https://chadwin.co/docs/institutional-holdings
paths:
  /v1/institutional-managers:
    get:
      tags:
      - Institutional holdings
      operationId: listInstitutionalManagers
      summary: List institutional managers
      description: Returns institutional managers ordered by name and Form 13F file number. Optional CIK and Form 13F file-number filters resolve the source filer associated with each manager profile.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: Optional manager CIK filter for source filers associated with a manager profile.
        required: false
        description: Optional manager CIK filter for source filers associated with a manager profile.
        name: cik
        in: query
        examples:
          default:
            value: 0001067983
            x-disabled: false
      - schema:
          type: string
          description: Optional Form 13F file-number filter for source filers associated with a manager profile.
        required: false
        description: Optional Form 13F file-number filter for source filers associated with a manager profile.
        name: form_13f_file_number
        in: query
        examples:
          default:
            value: 028-04545
            x-disabled: false
      - schema:
          type: string
          description: Use `next_cursor` from the previous response
        required: false
        description: Use `next_cursor` from the previous response
        name: cursor
        in: query
        examples:
          default:
            value: cur_request_bound_example
            x-disabled: false
      - schema:
          type: string
          default: '500'
          description: Page size from 1 through 1000.
        required: false
        description: Page size from 1 through 1000.
        name: limit
        in: query
        examples:
          default:
            value: '500'
            x-disabled: false
      responses:
        '200':
          description: Institutional managers
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalManagersResponse'
              example:
                managers:
                - name: Berkshire Hathaway Inc.
                  form_13f_file_number: 028-04545
                  cik: 0001067983
                  latest_period_of_report: '2026-03-31'
                  holding_count: 124
                  total_value_usd: '267891234567'
                  latest_accepted_at: '2026-05-15T20:12:34.000Z'
                next_cursor: cur_request_bound_example
                has_more: false
        '400':
          description: The query parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalHoldingsBadRequestResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: const result = await client.institutionalManagers.list();
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/institutional-managers' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/institutional-managers/search:
    get:
      tags:
      - Institutional holdings
      operationId: searchInstitutionalManagers
      summary: Search institutional managers
      description: Returns at most 25 institutional managers ranked by Form 13F file number, CIK, and manager or source-filer name matches. The result has no pagination or configurable limit.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Manager name, current source-filer name, Form 13F file number, or padded or unpadded CIK.
        required: true
        description: Manager name, current source-filer name, Form 13F file number, or padded or unpadded CIK.
        name: query
        in: query
        examples:
          default:
            value: Berkshire
            x-disabled: false
      responses:
        '200':
          description: Institutional manager matches
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalManagerSearchResponse'
              example:
                managers:
                - name: Berkshire Hathaway Inc.
                  form_13f_file_number: 028-04545
                  cik: 0001067983
                  latest_period_of_report: '2026-03-31'
                  holding_count: 124
                  total_value_usd: '267891234567'
                  latest_accepted_at: '2026-05-15T20:12:34.000Z'
        '400':
          description: The query is missing, invalid, or has unsupported keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalManagerSearchBadRequestResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: "const result = await client.institutionalManagers.search({\n  query: \"Berkshire\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/institutional-managers/search?query=Berkshire' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/institutional-managers/{form_13f_file_number}:
    get:
      tags:
      - Institutional holdings
      operationId: getInstitutionalManager
      summary: Get institutional manager
      description: Returns one institutional manager identified by Form 13F file number and its latest effective holdings period when available.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: SEC Form 13F file number
        required: true
        description: SEC Form 13F file number
        name: form_13f_file_number
        in: path
        examples:
          default:
            value: 028-04545
            x-disabled: false
      responses:
        '200':
          description: Institutional manager
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalManagerDetailResponse'
              example:
                manager:
                  name: Berkshire Hathaway Inc.
                  form_13f_file_number: 028-04545
                  cik: 0001067983
                latest_period:
                  period_of_report: '2026-03-31'
                  accepted_at: '2026-05-15T20:12:34.000Z'
                  holdings:
                    total_count: 124
                    total_value_usd: '267891234567'
                    url: /v1/institutional-managers/028-04545/holdings?period=2026-03-31
        '400':
          description: The Form 13F file number is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalHoldingsBadRequestResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '404':
          description: The requested manager was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: "const result = await client.institutionalManagers.get({\n  form13fFileNumber: \"028-04545\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/institutional-managers/028-04545' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
