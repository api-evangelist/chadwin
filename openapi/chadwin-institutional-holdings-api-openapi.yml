  /v1/institutional-filings/{accession}:
    get:
      tags:
      - Institutional holdings
      operationId: getInstitutionalFiling
      summary: Get institutional filing
      description: Returns as-filed metadata for one 13F-HR, 13F-HR/A, 13F-NT, or 13F-NT/A accession. Holdings reports link to a separate paginated information-table endpoint; notice filings have no holdings rows.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: SEC accession number with dashes
        required: true
        description: SEC accession number with dashes
        name: accession
        in: path
        examples:
          default:
            value: 0000950123-26-004321
            x-disabled: false
