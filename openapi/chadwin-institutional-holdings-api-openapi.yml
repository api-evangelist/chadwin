          - integer
          - 'null'
          minimum: 0
          example: 124
        total_value_usd:
          type:
          - string
          - 'null'
          example: '267891234567'
        latest_accepted_at:
          type:
          - string
          - 'null'
          example: '2026-05-15T20:12:34.000Z'
      required:
      - name
      - form_13f_file_number
      - cik
      - latest_period_of_report
      - holding_count
      - total_value_usd
      - latest_accepted_at
    InstitutionalHoldingVotingAuthority:
