        shared:
          type:
          - string
          - 'null'
          example: '0'
          description: Quantity over which the manager reports shared voting authority, or null.
        none:
          type:
          - string
          - 'null'
          example: '0'
          description: Quantity over which the manager reports no voting authority, or null.
      required:
      - sole
      - shared
      - none
