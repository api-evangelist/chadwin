  /v1/institutional-managers/{form_13f_file_number}/holdings:
    get:
      tags:
      - Institutional holdings
      operationId: listInstitutionalManagerHoldings
      summary: List manager holdings
      description: Returns effective holdings for one institutional manager and report period. Restatements replace the active set and new-holdings amendments append their as-filed rows; each result identifies its source accession.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: SEC Form 13F file number
        required: true
        description: SEC Form 13F file number
        name: form_13f_file_number
        in: path
        examples:
          default:
            value: 028-04545
            x-disabled: false
      - schema:
          type: string
          description: Required report period. Use latest for the latest available manager period, or YYYY-MM-DD for a concrete period.
        required: true
        description: Required report period. Use latest for the latest available manager period, or YYYY-MM-DD for a concrete period.
        name: period
        in: query
        examples:
          default:
            value: latest
            x-disabled: false
      - schema:
          type: string
          description: Use `next_cursor` from the previous response
        required: false
        description: Use `next_cursor` from the previous response
        name: cursor
        in: query
        examples:
          default:
            value: cur_request_bound_example
            x-disabled: false
      - schema:
          type: string
          default: '1000'
          description: Page size from 1 through 5000.
        required: false
        description: Page size from 1 through 5000.
        name: limit
        in: query
        examples:
          default:
            value: '1000'
            x-disabled: false
      responses:
        '200':
          description: Manager holdings
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalManagerHoldingsResponse'
              example:
                manager:
                  name: Berkshire Hathaway Inc.
                  form_13f_file_number: 028-04545
                  cik: 0001067983
                period:
                  period_of_report: '2026-03-31'
                  accepted_at: '2026-05-15T20:12:34.000Z'
                holdings:
                - security:
                    issuer: APPLE INC
                    title_of_class: COM
                    company:
                      name: Apple Inc.
                      cik: 0000320193
                      ticker: AAPL
                      exchange: NASDAQ
                    option_type: null
                  position:
                    amount: '1245000'
                    type: shares
                    market_value_usd: '221563000'
                  investment_discretion: SOLE
                  other_managers: []
                  voting_authority:
                    sole: '1245000'
                    shared: '0'
                    none: '0'
                  source:
                    accession_number: 0000950123-26-004321
                next_cursor: cur_request_bound_example
                has_more: false
        '400':
          description: The query parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalHoldingsBadRequestResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '404':
          description: The requested manager or report period was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The manager-period holdings changed after the cursor was issued. Restart pagination from the first page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The response could not be constructed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: "const result = await client.institutionalManagers.listHoldings({\n  form13fFileNumber: \"028-04545\",\n  period: \"latest\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/institutional-managers/028-04545/holdings?period=latest' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
