openapi: 3.2.0
info:
  title: Chadwin Insider activity API
  version: v1
  description: Explore the available endpoints, view their parameters and response fields, and see example requests and responses. For help understanding the datasets and planning your integration, read the guides.
servers:
- url: https://api.chadwin.co
tags:
- name: Insider activity
  description: Find transactions on Forms 4 and 5, retrieve Form 3, 4, and 5 filings, and find proposed sales on Form 144. Use the insider activity feed for new Forms 3, 4, 5, and 144, or the insider transaction feed for individual transactions on Forms 4 and 5.
  externalDocs:
    description: Read the insider filings guide
    url: https://chadwin.co/docs/insider-filings
paths:
  /v1/insider-transactions:
    get:
      tags:
      - Insider activity
      operationId: listInsiderTransactions
      summary: List insider transactions
      description: Lists transactions from Forms 4 and 5, including amendments. Filter by ticker, CIK, transaction code, or filing date.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: Include filings from this date (YYYY-MM-DD)
        required: true
        description: Include filings from this date (YYYY-MM-DD)
        name: from
        in: query
        examples:
          default:
            value: '2026-05-01'
            x-disabled: false
      - schema:
          type: string
          description: Comma-separated ticker filter. Mutually exclusive with ciks.
        required: false
        description: Comma-separated ticker filter. Mutually exclusive with ciks.
        name: tickers
        in: query
        examples:
          default:
            value: AAPL,MSFT
            x-disabled: false
      - schema:
          type: string
          example: 0000320193,0000789019
          description: Filing entity CIKs. Mutually exclusive with tickers; reference rows are not required.
        required: false
        description: Filing entity CIKs. Mutually exclusive with tickers; reference rows are not required.
        name: ciks
        in: query
      - schema:
          type: string
          description: Include filings through this date (YYYY-MM-DD); defaults to today
        required: false
        description: Include filings through this date (YYYY-MM-DD); defaults to today
        name: until
        in: query
        examples:
          default:
            value: '2026-05-31'
            x-disabled: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - A
            - C
            - D
            - E
            - F
            - G
            - H
            - I
            - J
            - K
            - L
            - M
            - O
            - P
            - S
            - U
            - V
            - W
            - X
            - Z
          description: Filter by SEC transaction code; comma-separated. Includes all codes by default.
        required: false
        description: Filter by SEC transaction code; comma-separated. Includes all codes by default.
        name: transaction_codes
        in: query
        style: form
        explode: false
        examples:
          default:
            value:
            - P
            - S
            - M
            x-disabled: false
      - schema:
          type: string
          description: Use `next_cursor` from the previous response
        required: false
        description: Use `next_cursor` from the previous response
        name: cursor
        in: query
        examples:
          default:
            value: cur_eyJ2IjoxLCJvcGVyYXRpb24iOiJpbnNpZGVyX3RyYW5zYWN0aW9ucyJ9
            x-disabled: false
      - schema:
          type: string
          description: Rows per page from 1 through 1000. Defaults to 1000.
        required: false
        description: Rows per page from 1 through 1000. Defaults to 1000.
        name: limit
        in: query
        examples:
          default:
            value: '1000'
            x-disabled: false
      responses:
        '200':
          description: Insider transactions
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsiderTransactionsResponse'
              example:
                transactions:
                - issuer:
                    cik: 0000320193
                    name: Apple Inc.
                    ticker: AAPL
                  accession_number: 0001140361-26-023363
                  row_kind: nonderivative_transaction
                  accepted_at: '2026-05-29T22:30:27.000Z'
                  footnotes:
                  - id: F1
                    text: This transaction was executed in multiple trades at prices ranging from $310.76 to $311.42; the price reported above reflects the weighted average sale price. The reporting person hereby undertakes to provide full information regarding the number of shares and prices at which the transactions were effected upon request to the SEC staff, Apple, or a security holder of Apple.
                  reporting_owners:
                  - cik: 0001214128
                    name: LEVINSON ARTHUR D
                    address:
                      street1: ONE APPLE PARK WAY
                      street2: null
                      city: CUPERTINO
                      state: CA
                      zip_code: '95014'
                      country: null
                    relationship:
                      is_director: true
                      is_officer: null
                      is_ten_percent_owner: null
                      is_other: null
                      officer_title: null
                      other_text: null
                  source_row_index: 1
                  transaction_code: S
                  transaction_date: '2026-05-27'
                  deemed_execution_date: null
                  transaction_form_type: '4'
                  security: Common Stock
                  shares: '50000'
                  price: '311.02'
                  transaction_total_value: null
                  acquired_disposed_code: D
                  shares_owned_after: '3764576'
                  ownership_type: direct
                  nature_of_ownership: null
                  transaction_timeliness: null
                  equity_swap_involved: false
                  conversion_or_exercise_price: null
                  exercise_date: null
                  expiration_date: null
                  underlying_security: null
                  footnote_ids:
                  - F1
                  field_footnote_ids:
                    price:
                    - F1
                  sec_url: https://www.sec.gov/Archives/edgar/data/320193/000114036126023363/0001140361-26-023363-index.htm
                - issuer:
                    cik: 0000320193
                    name: Apple Inc.
                    ticker: AAPL
                  accession_number: 0001140361-26-023363
                  row_kind: nonderivative_transaction
                  accepted_at: '2026-05-29T22:30:27.000Z'
                  footnotes: []
                  reporting_owners:
                  - cik: 0001214128
                    name: LEVINSON ARTHUR D
                    address:
                      street1: ONE APPLE PARK WAY
                      street2: null
                      city: CUPERTINO
                      state: CA
                      zip_code: '95014'
                      country: null
                    relationship:
                      is_director: true
                      is_officer: null
                      is_ten_percent_owner: null
                      is_other: null
                      officer_title: null
                      other_text: null
                  source_row_index: 2
                  transaction_code: G
                  transaction_date: '2026-05-27'
                  deemed_execution_date: null
                  transaction_form_type: '4'
                  security: Common Stock
                  shares: '65000'
                  price: '0'
                  transaction_total_value: null
                  acquired_disposed_code: D
                  shares_owned_after: '3699576'
                  ownership_type: direct
                  nature_of_ownership: null
                  transaction_timeliness: null
                  equity_swap_involved: false
                  conversion_or_exercise_price: null
                  exercise_date: null
                  expiration_date: null
                  underlying_security: null
                  footnote_ids: []
                  field_footnote_ids: {}
                  sec_url: https://www.sec.gov/Archives/edgar/data/320193/000114036126023363/0001140361-26-023363-index.htm
                next_cursor: null
                has_more: false
        '400':
          description: The query parameters or pagination cursor are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsiderTransactionsBadRequestResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '404':
          description: A ticker was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A ticker resolves to multiple companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: "const result = await client.insiderTransactions.list({\n  from: \"2026-05-01\",\n  until: \"2026-05-31\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/insider-transactions?from=2026-05-01&until=2026-05-31' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/insider-filings/{accession}:
    get:
      tags:
      - Insider activity
      operationId: getInsiderFiling
      summary: Get insider filing
      description: Returns one parsed Section 16 ownership filing (Form 3, Form 4, or Form 5) as filed, including filing metadata, reporting owners, footnotes, transaction rows, and standalone holding rows. Amendments remain separate accessions.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: SEC accession number with dashes
        required: true
        description: SEC accession number with dashes
        name: accession
        in: path
        examples:
          default:
            value: 0001140361-26-023363
            x-disabled: false
      responses:
        '200':
          description: Insider filing
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsiderFilingDocument'
              example:
                issuer:
                  cik: 0000320193
                  name: Apple Inc.
                  ticker: AAPL
                accession_number: 0001140361-26-023363
                form: '4'
                accepted_at: '2026-05-29T22:30:27.000Z'
                period_of_report: '2026-05-27'
                date_of_original_submission: null
                not_subject_to_section_16: null
                rule_10b5_1: false
                remarks: null
                reporting_owners:
                - cik: 0001214128
                  name: LEVINSON ARTHUR D
                  address:
                    street1: ONE APPLE PARK WAY
                    street2: null
                    city: CUPERTINO
                    state: CA
                    zip_code: '95014'
                    country: null
                  relationship:
                    is_director: true
                    is_officer: null
                    is_ten_percent_owner: null
                    is_other: null
                    officer_title: null
                    other_text: null
                owner_signatures:
                - name: /s/ Sam Whittington, Attorney-in-Fact for Arthur D. Levinson
                  date: '2026-05-29'
                footnotes:
                - id: F1
                  text: This transaction was executed in multiple trades at prices ranging from $310.76 to $311.42; the price reported above reflects the weighted average sale price. The reporting person hereby undertakes to provide full information regarding the number of shares and prices at which the transactions were effected upon request to the SEC staff, Apple, or a security holder of Apple.
                non_derivative_transactions:
                - source_row_index: 1
                  transaction_code: S
                  transaction_date: '2026-05-27'
                  deemed_execution_date: null
                  transaction_form_type: '4'
                  security: Common Stock
                  shares: '50000'
                  price: '311.02'
                  transaction_total_value: null
                  acquired_disposed_code: D
                  shares_owned_after: '3764576'
                  ownership_type: direct
                  nature_of_ownership: null
                  transaction_timeliness: null
                  equity_swap_involved: false
                  conversion_or_exercise_price: null
                  exercise_date: null
                  expiration_date: null
                  underlying_security: null
                  footnote_ids:
                  - F1
                  field_footnote_ids:
                    price:
                    - F1
                - source_row_index: 2
                  transaction_code: G
                  transaction_date: '2026-05-27'
                  deemed_execution_date: null
                  transaction_form_type: '4'
                  security: Common Stock
                  shares: '65000'
                  price: '0'
                  transaction_total_value: null
                  acquired_disposed_code: D
                  shares_owned_after: '3699576'
                  ownership_type: direct
                  nature_of_ownership: null
                  transaction_timeliness: null
                  equity_swap_involved: false
                  conversion_or_exercise_price: null
