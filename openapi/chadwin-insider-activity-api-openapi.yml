        source: "const result = await client.insiderFilings.get({\n  accessionNumber: \"0001140361-26-023363\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/insider-filings/0001140361-26-023363' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/proposed-sales:
    get:
      tags:
      - Insider activity
      operationId: listProposedSales
      summary: List proposed sales
      description: Returns one cursor-paginated page of as-filed proposed-sale rows from Form 144 and Form 144/A in SEC acceptance order.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          example: '2026-07-01'
          description: Include filings from this date (YYYY-MM-DD)
        required: true
        description: Include filings from this date (YYYY-MM-DD)
        name: from
        in: query
      - schema:
          type: string
          example: AAPL,MSFT
          description: Company tickers; mutually exclusive with ciks.
        required: false
        description: Company tickers; mutually exclusive with ciks.
        name: tickers
        in: query
      - schema:
          type: string
          example: 0000320193,0000789019
          description: Filing entity CIKs; mutually exclusive with tickers. Reference rows are not required.
        required: false
        description: Filing entity CIKs; mutually exclusive with tickers. Reference rows are not required.
        name: ciks
        in: query
      - schema:
          type: string
          example: '2026-07-31'
          description: Include filings through this date (YYYY-MM-DD); defaults to today
        required: false
        description: Include filings through this date (YYYY-MM-DD); defaults to today
        name: until
        in: query
      - schema:
          type: string
          example: cur_eyJ2IjoxLCJvcGVyYXRpb24iOiJwcm9wb3NlZF9zYWxlcyJ9
          description: Use `next_cursor` from the previous response
        required: false
        description: Use `next_cursor` from the previous response
        name: cursor
        in: query
      - schema:
          type: string
          example: '1000'
          description: Rows per page from 1 through 1000. Defaults to 1000.
        required: false
        description: Rows per page from 1 through 1000. Defaults to 1000.
        name: limit
        in: query
      responses:
        '200':
          description: Proposed sales
          headers:
            Cache-Control:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedSalesResponse'
              example:
                proposed_sales:
                - issuer:
                    cik: 0000320193
                    name: Apple Inc.
                    ticker: AAPL
                  accession_number: 0001140361-26-030001
                  source_row_index: 1
                  accepted_at: '2026-07-29T18:04:05.000Z'
                  reporting_person:
                    cik: '0002100523'
                    name: Example Reporting Person
                    relationships:
                    - Officer
                  security: Common Stock
                  amount: '100'
                  market_value: '20000.00'
                  approximate_sale_date: '2026-07-30'
                  sec_url: https://www.sec.gov/Archives/edgar/data/320193/000114036126030001/0001140361-26-030001-index.htm
                next_cursor: null
                has_more: false
        '400':
          description: The query parameters or pagination cursor are invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_cursor
                    - invalid_date_window
                    - invalid_limit
                    - invalid_query_parameters
                required:
                - error
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '404':
          description: A ticker was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A ticker resolves to multiple companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
        source: "const result = await client.proposedSales.list({\n  from: \"2026-07-01\",\n  until: \"2026-07-31\",\n});"
      - label: curl
        lang: Shell
        source: "curl 'https://api.chadwin.co/v1/proposed-sales?from=2026-07-01&until=2026-07-31' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/proposed-sale-filings/{accession}:
    get:
      tags:
      - Insider activity
      operationId: getProposedSaleFiling
      summary: Get proposed sale filing
      description: Returns the details of one Form 144 filing, including the proposed sale, acquisition history, and sales made during the past three months. Sales listed only in an attached exhibit are not included.
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          example: 0001140361-26-030001
          description: SEC accession number with dashes
        required: true
        description: SEC accession number with dashes
        name: accession
        in: path
      responses:
        '200':
          description: Proposed sale filing
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedSaleFilingDetail'
              example:
                issuer:
                  cik: 0000320193
                  name: Apple Inc.
                  ticker: AAPL
                accession_number: 0001140361-26-030001
                form: '144'
                accepted_at: '2026-07-29T18:04:05.000Z'
                previous_accession_number: null
                reporting_person:
                  cik: '0002100523'
                  name: Example Reporting Person
                  relationships:
                  - Officer
                proposed_sales:
                - source_row_index: 1
                  security: Common Stock
                  amount: '100'
                  market_value: '20000.00'
                  amount_outstanding: '15000000000'
                  approximate_sale_date: '2026-07-30'
                  broker_or_market_maker: Example Broker
                  intended_sale_exchange: NASDAQ
                securities_to_be_sold:
                - source_row_index: 1
                  security: Common Stock
                  acquisition_date: '2025-01-15'
                  acquisition_method: Restricted stock vesting
                  acquired_from: Apple Inc.
                  is_gift: false
                  amount: '100'
                  donor_acquisition_date: null
                  payment_date: null
                  payment_method: Services
                nothing_to_report: true
                past_three_month_sales: []
                remarks: null
                notice:
                  date: '2026-07-29'
                  plan_adoption_dates:
                  - '2026-01-10'
                  signature: /s/ Example Reporting Person
                sec_url: https://www.sec.gov/Archives/edgar/data/320193/000114036126030001/0001140361-26-030001-index.htm
        '400':
          description: The accession is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The request is missing a valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The subscription does not include this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetNotEntitledErrorResponse'
        '404':
          description: The Form 144 filing was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The request exceeded a rate limit
          headers:
            Retry-After:
              schema:
                type: string
            RateLimit-Limit:
              schema:
                type: string
            RateLimit-Reset:
              schema:
                type: string
            X-Billing-Period-Quota-Limit:
              schema:
                type: string
            X-Billing-Period-Quota-Remaining:
              schema:
                type: string
            X-Billing-Period-Quota-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The filing storage layer is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - label: Node.js
        lang: JavaScript
