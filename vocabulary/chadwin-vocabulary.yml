  - term: Company KPIs
    definition: Issuer-specific operating KPIs with annual, half-year and quarterly values from original SEC filing documents. Free subscriber
      beta.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
  - term: Company reports
    definition: Retrieve annual and quarterly company reports as cleaned HTML, and follow updates for Forms 10-K, 10-Q, 20-F, and 40-F and their
      amendments.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
  - term: Current reports
    definition: Retrieve 8-K and 6-K reports with readable exhibits in one HTML response, and follow new reports and amendments through the update
      feed.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
  - term: Normalized financial statements
    definition: Annual financial statements and financial metrics.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
  - term: Insider activity
    definition: Find transactions on Forms 4 and 5, retrieve Form 3, 4, and 5 filings, and find proposed sales on Form 144. Use the insider activity
      feed for new Forms 3, 4, 5, and 144, or the insider transaction feed for individual transactions on Forms 4 and 5.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
  - term: Institutional holdings
    definition: Find institutional managers and reporting periods, retrieve Form 13F filings and holdings, and view a manager's holdings and consolidated
      positions. Follow new Forms 13F-HR and 13F-NT and their amendments through the update feed.
    tags:
    - Resource Group
    source: openapi/_original/chadwin-api-openapi.json
